node_types:
  - id: concept
    label: 基础概念
    short_label: 概念
    description: 定义领域中的上位对象、状态与关键区别。
    color: "#E58E8A"
    selected_color: "#D76563"
  - id: practice
    label: 具体练习
    short_label: 练习
