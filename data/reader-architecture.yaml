    label: 现实回应
    short_label: 回应
    description: 把觉察转成调节、沟通、问题解决与现实行动。
    color: "#E28B52"
    selected_color: "#BE5D2C"
  - id: evidence
    label: 效果与证据
    short_label: 证据
    description: 判断效果命题、研究设计、时间尺度与个体差异。
    color: "#8F83C6"
    selected_color: "#6859AA"
  - id: safety
    label: 风险与边界
    short_label: 风险与边界
    description: 说明何时调整、停止、回到现实安全或寻求帮助。
    color: "#C7687A"
    selected_color: "#9E3F54"
  - id: context
    label: 传统与方案
    short_label: 传统与方案
    description: 保留实践的传统、课程、共同体与伦理语境。
    color: "#6FA497"
    selected_color: "#437A6E"
