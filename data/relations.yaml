  direction: undirected
  type: timescale
  reason: 横断差异、课程前后变化和长期保持回答不同问题，稳定特质需要跨时间与随访。
- id: REL-0836
  from: EVD-030
  to: EVD-032
  direction: undirected
  type: hierarchy
  reason: 随机试验常含纵向测量，但纵向不等于随机；随机分配是减少混杂、加强干预因果判断的条件。
- id: REL-0838
  from: EVD-032
  to: EVD-033
  direction: undirected
  type: design
  reason: 随机化处理组间起点差异，主动对照进一步决定试验排除了哪些共同情境因素。
- id: REL-0840
  from: EVD-032
  to: MED-032
  direction: undirected
  type: intervention_object
  reason: 一项课程随机试验检验的是整套干预，不能把结果全部归给其中一次呼吸或扫描练习。
- id: REL-0841
  from: EVD-033
  to: SYS-046
  direction: undirected
  type: control
  reason: 主动对照需要匹配期待并测量其影响；期待会真实影响投入、体验和报告。
- id: REL-0842
  from: EVD-033
  to: SYS-047
  direction: undirected
  type: context
  reason: 教师、团体、解释与反馈既可能参与结果，也影响困难发现；主动对照要说明匹配了哪些共同因素。
- id: REL-0843
  from: EVD-033
  to: EVD-034
  direction: undirected
  type: heterogeneity
  reason: 同类冥想研究使用不同对照组，汇总平均效果时必须区分候补、常规照护与主动对照。
- id: REL-0844
  from: EVD-034
  to: EVD-032
  direction: undirected
  type: evidence_synthesis
  reason: 元分析可以汇总随机试验，但不会修复各试验的偏倚、退出、结局选择或干预定义问题。
- id: REL-0845
  from: EVD-034
  to: EVD-030
  direction: undirected
  type: boundary
  reason: 合并多项观察性相关研究不会自动产生因果；可作何种推断仍取决于原始设计。
- id: REL-0846
  from: EVD-034
  to: EVD-001
  direction: undirected
  type: evidence
  reason: 效果判断常依赖证据综合，但平均效应必须落回具体人群、方案、比较对象和结局。
- id: REL-0847
  from: EVD-036
  to: EVD-030
  direction: undirected
  type: boundary
  reason: 测量更客观不会把相关变成因果；因果强度仍由比较、时间和分配设计决定。
- id: REL-0848
  from: EVD-036
  to: EVD-037
  direction: undirected
  type: interpretation
  reason: 同样一分变化，在普通波动、自报症状和临床功能结局中意义可能完全不同。
- id: REL-0849
  from: EVD-036
  to: EMO-002
  direction: undirected
  type: measurement
  reason: 情绪的第一人称感受本身就是需要测量的现象，不能被脑图或生理数字直接替代。
- id: REL-0850
  from: EVD-037
  to: EMO-033
  direction: undirected
  type: boundary
  reason: 焦虑可以是适应性状态，也可能成为持续且损害功能的临床问题，不能只凭感觉名称归类。
- id: REL-0851
  from: EVD-037
  to: EVD-006
  direction: undirected
  type: clinical_generalization
  reason: 焦虑研究的人群、严重度和比较治疗不同，平均效果不能变成个人治疗建议。
- id: REL-0852
  from: EVD-037
  to: EVD-007
  direction: undirected
  type: clinical_generalization
  reason: 当前低落、抑郁症状与反复抑郁复发预防是不同问题，冥想证据不能混用。
- id: REL-0853
  from: EVD-038
  to: EXP-006
  direction: undirected
  type: component
  reason: 单次时长、频率、持续周期、课程要求与实际完成量共同构成剂量，不能简单互换。
- id: REL-0855
  from: EVD-038
  to: EVD-002
  direction: undirected
  type: boundary
  reason: 重复练习可能参与长期学习，但累计分钟数不是特质变化的直接证明。
- id: REL-0856
  from: EVD-038
  to: EVD-039
  direction: undirected
  type: moderation
  reason: 同一剂量对不同人可能是可持续训练、无明显作用或过高负荷，平均值不能代替适配。
- id: REL-0857
  from: EVD-039
  to: EXP-027
  direction: undirected
  type: application
  reason: 同一个人在不同状态和情境下也可能需要不同练习；可靠预测不足时，安全试采样比人格标签更稳妥。
- id: REL-0859
  from: EVD-039
  to: SAF-001
  direction: undirected
  type: risk
  reason: 个体反应不仅体现在获益大小，也包括困难体验、功能影响与停止需要。
- id: REL-0860
  from: EVD-040
  to: EVD-020
  direction: undirected
  type: replication
  reason: 热门脑结构结果受到小样本、横断设计和发表偏倚限制，严格随机研究未复现普遍八周改变。
- id: REL-0861
  from: EVD-040
  to: EVD-032
  direction: undirected
  type: reporting
  reason: 随机标签不阻止结局挑选和未发表；预注册、完整报告与复现仍然必要。
- id: REL-0862
  from: EVD-040
  to: EVD-034
  direction: undirected
  type: bias
  reason: 元分析会继承缺失研究与选择性报告，需要主动评估发表偏倚和结果稳定性。
- id: REL-0863
  from: EVD-040
  to: EVD-001
  direction: undirected
  type: boundary
  reason: 若无效和负向结果较少进入文献，公开研究中的平均效果可能显得过于乐观。
- id: REL-0867
  from: EVD-033
  to: MED-032
  direction: undirected
  type: intervention_object
  reason: 多组件课程结果不能只归给一个动作，特异成分需要更针对性的比较设计。
- id: REL-0869
  from: SAF-001
  to: SAF-003
  direction: undirected
  type: monitoring
  reason: 主动、具体地询问持续、功能与处理结果，才能区分困难、不愉快经历、不良影响和伤害。
- id: REL-0870
  from: SAF-001
  to: PRA-045
  direction: undirected
  type: application
  reason: 个人记录把现象、时间、持续和功能分开，是风险分层在练习现场的应用。
- id: REL-0872
  from: SAF-001
  to: MED-036
  direction: undirected
  type: context
  reason: 密集练习样本的体验范围和负荷不能直接外推普通短时练习。
- id: REL-0873
  from: SAF-001
  to: EVD-030
  direction: undirected
  type: causality
  reason: 体验发生在练习中或之后提供时间关联，不能排除健康、睡眠、压力和其他共同原因。
- id: REL-0874
  from: SAF-003
  to: PRA-045
  direction: undirected
  type: application
  reason: 个人记录可为反馈提供时间、持续与功能信息，但正式监测还需预设流程和责任人。
- id: REL-0875
  from: SAF-003
  to: EVD-032
  direction: undirected
  type: reporting
  reason: 随机试验若不主动、同等监测各组伤害，仍无法可靠比较安全性。
- id: REL-0876
  from: SAF-004
  to: SYS-040
  direction: undirected
  type: application
  reason: 创伤反应可能涉及闪回、警觉、回避和解离，练习设计需要允许不同反应路径。
- id: REL-0877
  from: SAF-004
  to: SYS-041
  direction: undirected
  type: safety
  reason: 向内注意若加重不真实感或身体陌生，应恢复外部定向并停止追求深入。
- id: REL-0878
  from: SAF-004
  to: EXP-026
  direction: undirected
  type: strategy
  reason: 保留内外切换，使练习者能根据实时反应选择较可承受的注意对象。
- id: REL-0879
  from: SAF-004
  to: SAF-016
  direction: undirected
  type: application
  reason: 缩短、睁眼、换锚点和移动，是把选择权落实到练习现场的具体方式。
- id: REL-0880
  from: SAF-005
  to: EMO-010
  direction: undirected
  type: process
  reason: 心跳、呼吸、发麻和头晕会进入惊恐循环，但身体信号不能只凭感觉完成原因判断。
- id: REL-0881
  from: SAF-005
  to: EXP-016
  direction: undirected
  type: adjustment
  reason: 呼吸成为压力源时可以停止控制并换锚点，持续或严重症状优先现实评估。
- id: REL-0882
  from: SAF-005
  to: EXP-026
  direction: undirected
  type: choice
  reason: 惊恐升级时外部视觉、声音和接触点可能比继续扫描内部信号更可承受。
- id: REL-0883
  from: SAF-005
  to: SAF-016
  direction: undirected
  type: application
  reason: 睁眼、换外部锚点、移动或结束，都是惊恐升级时可以立即使用的调整。
- id: REL-0884
  from: SAF-016
  to: EXP-006
  direction: undirected
  type: adjustment
  reason: 缩短或结束是最直接的负荷调整，分钟数不应成为必须完成的任务。
- id: REL-0885
  from: SAF-016
  to: EXP-005
  direction: undirected
  type: adjustment
  reason: 困倦、警觉或现实感变化时可以切换眼睛状态，睁眼不会降低练习等级。
- id: REL-0886
  from: SAF-016
  to: SAF-041
  direction: undirected
  type: safety
  reason: 普通不适可先调整；急性危险、严重症状、调整无效或功能受损时应停止并转向现实保护。
- id: REL-0887
  from: SAF-007
  to: EVD-007
  direction: undirected
  type: clinical_boundary
  reason: 抑郁效果证据必须区分当前严重发作、普通低落与缓解期复发预防。
- id: REL-0888
  from: SAF-007
  to: MED-029
  direction: undirected
  type: applicability
  reason: MBCT 的主要复发证据来自特定缓解期人群，不能直接变成严重发作时的自学方案。
- id: REL-0889
  from: SAF-007
  to: SAF-008
  direction: undirected
  type: risk
  reason: 自伤或自杀想法会改变处置优先级，不再等待冥想自助是否起效。
- id: REL-0890
  from: SAF-007
  to: SAF-018
  direction: undirected
  type: boundary
  reason: 严重抑郁需要与专业人员共同选择治疗和支持，冥想最多是其中可能的一部分。
- id: REL-0891
  from: SAF-008
  to: SAF-018
  direction: undirected
  type: help_seeking
  reason: 自杀风险需要现实危机支持、专业评估和后续照护，而不是只靠个人练习记录。
- id: REL-0892
  from: SAF-008
  to: SAF-041
  direction: undirected
  type: safety
  reason: 当前意图、计划、手段或无法保证安全时，应立即进入紧急保护路径。
- id: REL-0893
  from: SAF-008
  to: PRA-045
  direction: undirected
  type: escalation
  reason: 记录可以帮助说清变化，但自杀风险一旦出现，行动与求助优先于继续记录。
- id: REL-0894
  from: SAF-008
  to: SAF-014
  direction: undirected
  type: safety
  reason: 当前自杀意图、计划或手段不能被解释为死亡观材料，必须转向危机安全。
- id: REL-0895
  from: SAF-010
  to: MED-008
  direction: undirected
  type: boundary
  reason: 不同呼吸动作改变节律和通气的方式不同，不能共用“呼吸练习都安全”的判断。
- id: REL-0896
  from: SAF-010
  to: EXP-016
  direction: undirected
  type: feedback
  reason: 气短、憋闷或越注意越紧是需要换锚点、停止控制或评估的实时反馈。
- id: REL-0897
  from: SAF-010
  to: SAF-005
  direction: undirected
  type: risk
  reason: 头晕、心跳和呼吸变化可能进入惊恐循环，但不能仅凭体验判断身体原因。
- id: REL-0898
  from: SAF-010
  to: SAF-016
  direction: undirected
  type: stopping
  reason: 主动呼吸持续加重症状或出现急性身体警示时，停止比完成次数更重要。
- id: REL-0899
  from: SAF-014
  to: MED-020
  direction: undirected
  type: tradition
  reason: 死随念与骸骨／墓地观来自具体佛教修行语境，不能脱离目标和次第只留刺激意象。
- id: REL-0900
  from: SAF-014
  to: MED-009
  direction: undirected
  type: distinction
  reason: 对死亡、无常与生活方向的思考属于沉思性实践，但不等于所有死亡观技术。
- id: REL-0901
  from: SAF-014
  to: SAF-016
  direction: undirected
  type: stopping
  reason: 死亡意象引发侵入性画面、创伤激活或自伤内容时，应允许立即结束。
- id: REL-0903
  from: SAF-016
  to: SAF-001
  direction: undirected
  type: risk
  reason: 不适的持续、强度和功能影响决定它是否仍可观察，还是需要停止和升级支持。
- id: REL-0904
  from: SAF-016
  to: SAF-018
  direction: undirected
  type: escalation
  reason: 停止后症状不恢复、反复恶化或影响功能时，需要由合适专业人员继续判断。
- id: REL-0906
  from: SAF-018
  to: EVD-037
  direction: undirected
  type: triage
  reason: 持续时间、严重度、功能与人群决定何时从普通自助转向临床评估，临床证据不能由日常状态替代。
- id: REL-0907
  from: SAF-018
  to: SYS-047
  direction: undirected
  type: context
  reason: 专业资质之外，还要看关系是否允许反馈困难、共同决策和调整方案。
- id: REL-0908
  from: SAF-018
  to: MED-032
  direction: undirected
  type: intervention_object
  reason: 完整临床方案包含筛选、教师、反馈和多个成分，不能缩成一个练习后继承治疗证据。
- id: REL-0911
  from: SAF-020
  to: EVD-011
  direction: undirected
  type: evidence_boundary
  reason: 睡眠质量研究不能推出冥想分钟与睡眠时长可以互换。
- id: REL-0912
  from: SAF-020
  to: SYS-044
  direction: undirected
  type: distinction
  reason: 疲劳、困倦与睡眠不足相关但不同，短时主观变化不能证明恢复完成。
- id: REL-0913
  from: SAF-020
  to: EXP-011
  direction: undirected
  type: feedback
  reason: 练习中睡着是一条状态反馈，不是深度或睡眠替代效果。
- id: REL-0914
  from: SAF-020
  to: SAF-016
  direction: undirected
  type: stopping
  reason: 困倦影响现实任务与安全时，应结束练习并优先休息或睡眠。
- id: REL-0915
  from: SAF-021
  to: PRA-041
  direction: undirected
  type: action
  reason: 觉察提供线索，练后分流把线索转成休息、沟通、求助、边界或问题解决。
- id: REL-0916
  from: SAF-021
  to: EXP-035
  direction: undirected
  type: distinction
  reason: 接纳内部体验不等于取消边界与改变处境；灵性语言反复替代行动时会形成现实逃避。
- id: REL-0917
  from: SAF-021
  to: EMO-027
  direction: undirected
  type: method
  reason: 对可控问题，收集信息、生成方案和执行反馈不能由继续观察取代。
- id: REL-0918
  from: SAF-021
  to: SAF-041
  direction: undirected
  type: safety
  reason: 危险、基本需要和急性问题出现时，现实处置优先于维持练习状态。
- id: REL-0921
  from: SAF-021
  to: MED-034
  direction: undirected
  type: ethics
  reason: 灵性语言不能免除伤害责任、修复义务和对他人边界的尊重。
- id: REL-0922
  from: SAF-021
  to: EMO-023
  direction: undirected
  type: process
  reason: 灵性逃避可能借修行语言避开情绪，但不能与所有暂时转移注意或调节等同。
- id: REL-0923
  from: SAF-040
  to: EVD-030
  direction: undirected
  type: evidence
  reason: 个人成功、传统解释与练习同时出现只能提供经验或意义，不能代替比较设计建立健康因果。
- id: REL-0924
  from: SAF-040
  to: EVD-039
  direction: undirected
  type: generalization
  reason: 一个人真实感到受益，仍不能预测不同起点、处境和方案下的其他人会怎样反应。
- id: REL-0927
  from: SAF-040
  to: MED-032
  direction: undirected
  type: intervention
  reason: 课程通常由练习、教学、社群和作业共同组成，单个成分研究不能替完整产品证明效果。
- id: REL-0928
  from: SAF-040
  to: EVD-040
  direction: undirected
  type: reporting_bias
  reason: 成功故事、商业宣传和公开文献都可能偏向正向结果；确定性需要复现、未发表与不理想结果共同校准。
- id: REL-0930
  from: SAF-040
  to: MED-016
  direction: undirected
  type: context
  reason: 传统修行与现代健康课程可能借用同一名称，却以不同目标、语言和评价方式组织练习。
- id: REL-0932
  from: SAF-040
  to: SAF-039
  direction: undirected
  type: distinction
  reason: 有些能量或超自然解释来自特定传统，但不能因此把全部传统等同超自然，也不能免除事实核验。
- id: REL-0934
  from: SAF-039
  to: MED-045
  direction: undirected
  type: interpretation
  reason: 强烈体验可以先被承认和描述，但主观确定感不能单独确认其超自然解释。
- id: REL-0935
  from: SAF-039
  to: SYS-025
  direction: undirected
  type: somatic
  reason: 温热、麻刺、震动和轻重变化是真实可感的身体事件，却不能凭感觉本身锁定唯一机制。
- id: REL-0936
  from: SAF-039
  to: SAF-018
  direction: undirected
  type: safety
  reason: 能量、排毒或灵性解释不能用来替持续症状完成诊断，也不能成为延误有效照护的理由。
- id: REL-0937
  from: SAF-040
  to: EVD-032
  direction: undirected
  type: study_design
  reason: 随机分配适合比较干预效果，却不会自动解决执行偏差、间接性、精确性和长期外推。
- id: REL-0938
  from: SAF-040
  to: EVD-034
  direction: undirected
  type: evidence_synthesis
  reason: 综述能系统整理多项研究，但结论确定性仍受纳入研究、异质性和综合方法限制。
